# Evita que Supabase (plan gratuito) pause el proyecto por inactividad:
# consulta la API una vez al día. Requiere dos «Repository variables»
# (Settings > Secrets and variables > Actions > Variables):
#   SUPABASE_URL       (p. ej. https://xxxx.supabase.co)
#   SUPABASE_ANON_KEY  (la clave anon pública)
# Nota: GitHub desactiva los workflows programados tras 60 días sin actividad
# en el repositorio; si ocurre, reactívelo en la pestaña Actions.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 9 * * *"     # todos los días, 09:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API de Supabase
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Faltan las variables SUPABASE_URL y SUPABASE_ANON_KEY"; exit 1
          fi
          # Sin sesión la consulta devuelve [] (RLS); basta con que llegue a la base de datos.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/tipos_evidencia?select=id&limit=1")
          echo "Respuesta HTTP: $code"
          [ "$code" = "200" ]
